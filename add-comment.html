<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taneesh — Новый комментарий</title>
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="icon" href="assets/brand/taneesh-logo-round.png" />
  <link rel="stylesheet" href="assets/tokens.css" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body data-shell="stack">
  <header class="header t-app-bar" id="header">
    <div class="wrap header-inner">
      <a class="icon-btn t-icon-button" id="back" href="event.html" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></a>
      <h1 class="header-title">Комментарий</h1>
    </div>
  </header>
  <main>
    <div class="wrap page-pad">
      <textarea class="t-textarea" id="text" placeholder="Что думаете о событии?" rows="5"></textarea>
      <button class="t-button t-button--primary t-button--block" type="button" id="send">Отправить</button>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <script src="assets/app.js"></script>
  <script>
    const id = TaneeshUI.query("id");
    document.getElementById("back").href = "event.html?id=" + id;
    document.getElementById("send").addEventListener("click", () => {
      TaneeshUI.toast("Комментарий отправлен");
      setTimeout(() => location.href = "event-comments.html?id=" + id, 800);
    });
    TaneeshUI.initCommon();
  </script>
</body>
</html>
