<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taneesh — Чаты</title>
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="icon" href="assets/brand/taneesh-logo-round.png" />
  <link rel="stylesheet" href="assets/tokens.css" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body data-page="chats">
  <header class="header t-app-bar" id="header">
    <div class="wrap header-inner">
      <h1 class="header-title">Чаты</h1>
      <div class="header-spacer"></div>
      <a class="icon-btn t-icon-button" href="chat-request.html" aria-label="Запросы">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </a>
    </div>
  </header>

  <main>
    <div class="wrap page-pad">
      <section class="section section--flush">
        <div class="section-head">
          <h2>Интересуются вами</h2>
          <a class="show-all" href="interests-you.html">Все</a>
        </div>
        <div class="rail interested-rail" id="interested"></div>
      </section>

      <section class="section">
        <div class="chat-list" id="chats"></div>
      </section>
    </div>
  </main>

  <nav id="t-nav" class="t-bottom-nav nav" aria-label="Навигация"></nav>
  <div class="toast" id="toast"></div>

  <script src="assets/app.js"></script>
  <script>
    document.getElementById("interested").innerHTML = TaneeshData.interested.map((p) => TaneeshUI.profileCard(p)).join("");

    document.getElementById("chats").innerHTML = TaneeshData.chats.map((c) => `
      <a class="chat-item" href="${TaneeshUI.chatHref(c)}">
        ${TaneeshUI.avatar(c.img, { size: "lg", online: c.online, alt: c.name })}
        <div class="u-min-0">
          <div class="chat-name">${c.name}</div>
          <div class="chat-preview">${c.preview}</div>
        </div>
        <div class="chat-meta">
          <div>${c.time}</div>
          ${c.unread ? `<span class="chat-unread t-badge">${c.unread}</span>` : ""}
        </div>
      </a>`).join("");

    TaneeshUI.initCommon();
  </script>
</body>
</html>
