<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taneesh — Комментарии события</title>
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="icon" href="assets/brand/taneesh-logo-round.png" />
  <link rel="stylesheet" href="assets/tokens.css" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body data-shell="stack">
  <header class="header t-app-bar" id="header">
    <div class="wrap header-inner">
      <a class="icon-btn t-icon-button" id="back" href="event.html" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></a>
      <h1 class="header-title">Комментарии</h1>
    </div>
  </header>
  <main>
    <div class="wrap page-pad comments" id="list"></div>
    <div class="wrap"><a class="t-button t-button--primary t-button--block" id="add" href="#">Написать</a></div>
  </main>
  <div class="toast" id="toast"></div>
  <script src="assets/app.js"></script>
  <script>
    const id = TaneeshUI.query("id");
    document.getElementById("back").href = "event.html?id=" + id;
    document.getElementById("add").href = "add-comment.html?id=" + id;
    const rows = TaneeshData.comments.filter((c) => c.eventId === id);
    document.getElementById("list").innerHTML = (rows.length ? rows : TaneeshData.comments).map((c) => `
      <article class="comment">
        ${TaneeshUI.avatar(c.av, { size: "sm" })}
        <div>
          <div class="comment-top"><strong>${c.user}</strong><time>${c.time}</time></div>
          <p class="comment-text">${c.text}</p>
        </div>
      </article>`).join("");
    TaneeshUI.initCommon();
  </script>
</body>
</html>
