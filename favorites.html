<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taneesh — Избранное</title>
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="icon" href="assets/brand/taneesh-logo-round.png" />
  <link rel="stylesheet" href="assets/tokens.css?v=20260904b" />
  <link rel="stylesheet" href="assets/app.css?v=20260904b" />
</head>
<body data-page="favorites">
  <header class="header t-app-bar" id="header">
    <div class="wrap header-inner">
      <h1 class="header-title">Избранное</h1>
    </div>
  </header>

  <main>
    <div class="wrap page-pad">
      <div class="t-tabs tabs" role="tablist">
        <button type="button" class="t-tab tab is-active" data-tab="events" role="tab" aria-selected="true">Мероприятия</button>
        <button type="button" class="t-tab tab" data-tab="people" role="tab" aria-selected="false">Люди</button>
      </div>

      <div id="tab-events">
        <div class="grid" id="favEvents"></div>
      </div>
      <div id="tab-people" hidden>
        <div class="users-grid" id="favPeople"></div>
      </div>
    </div>
  </main>

  <nav id="t-nav" class="t-bottom-nav nav" aria-label="Навигация"></nav>
  <div class="toast" id="toast"></div>

  <script src="assets/app.js?v=20260904b"></script>
  <script>
    const favEvents = TaneeshData.selectionEvents.map((e) => ({ ...e, liked: true }));
    const favPeople = TaneeshData.profiles.slice(0, 4);

    document.getElementById("favEvents").innerHTML = favEvents.map((e, i) => TaneeshUI.gridCard(e, i, "fav")).join("");
    document.getElementById("favPeople").innerHTML = favPeople.map((p) => TaneeshUI.profileCard(p, { tall: true })).join("");

    document.querySelectorAll(".t-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".t-tab").forEach((t) => {
          t.classList.remove("is-active");
          t.setAttribute("aria-selected", "false");
        });
        tab.classList.add("is-active");
        tab.setAttribute("aria-selected", "true");
        const isEvents = tab.dataset.tab === "events";
        document.getElementById("tab-events").hidden = !isEvents;
        document.getElementById("tab-people").hidden = isEvents;
      });
    });

    TaneeshUI.initCommon();
  </script>
</body>
</html>
