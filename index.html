<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taneesh — Главная</title>
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="icon" href="assets/brand/taneesh-logo-round.png" />
  <link rel="stylesheet" href="assets/tokens.css" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body data-page="home">
  <header class="header t-app-bar" id="header">
    <div class="wrap header-inner">
      <button class="city" type="button" data-toast="Выберите город">
        Чиланзар
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <label class="search t-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" placeholder="Поиск мероприятий по названию" id="searchInput" />
      </label>
      <span class="premium">Free</span>
      <button class="avatar t-avatar t-avatar--md" type="button" data-toast="Профиль" aria-label="Профиль">
        <img src="assets/showcase/avatar.png" alt="" />
      </button>
    </div>
  </header>

  <main>
    <div class="wrap page-pad">
      <section class="banners-block section section--flush">
        <div class="rail-wrap" data-rail>
          <button class="rail-btn prev" type="button" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
          <div class="rail" id="banners"></div>
          <button class="rail-btn next" type="button" aria-label="Вперёд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>Мои подборки</h2>
          <button class="show-all" type="button" data-toast="Мои подборки">Все</button>
        </div>
        <div class="rail-wrap" data-rail>
          <button class="rail-btn prev" type="button" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
          <div class="rail" id="selections"></div>
          <button class="rail-btn next" type="button" aria-label="Вперёд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>Новые профили</h2>
          <a class="show-all" href="people.html">Все</a>
        </div>
        <div class="rail-wrap" data-rail>
          <button class="rail-btn prev" type="button" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
          <div class="rail" id="profiles"></div>
          <button class="rail-btn next" type="button" aria-label="Вперёд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>Бесплатные мероприятия</h2>
          <button class="show-all" type="button" data-toast="Бесплатные мероприятия">Все</button>
        </div>
        <div class="rail-wrap" data-rail>
          <button class="rail-btn prev" type="button" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg></button>
          <div class="rail" id="free"></div>
          <button class="rail-btn next" type="button" aria-label="Вперёд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>Новые комментарии</h2>
          <button class="show-all" type="button" data-toast="Комментарии">Все</button>
        </div>
        <div class="comments" id="comments"></div>
      </section>

      <section class="section">
        <div class="section-head"><h2>Все мероприятия</h2></div>
        <div class="grid" id="allEvents"></div>
      </section>
    </div>
  </main>

  <nav id="t-nav" class="t-bottom-nav nav" aria-label="Навигация"></nav>
  <div class="toast" id="toast"></div>

  <script src="assets/app.js"></script>
  <script>
    const D = TaneeshData;
    const U = TaneeshUI;
    const all = [...D.selectionEvents, ...D.freeEvents,
      { title: "Live Jazz Hall", date: "14 апр, 21:00", price: "от 60 000", free: false, views: "870", likes: "55", types: ["Концерт"], img: "assets/showcase/concert2.png", liked: false },
      { title: "Startup Demo Day", date: "18 апр, 12:00", price: "от 90 000", free: false, views: "1.5k", likes: "99", types: ["Стартапы"], img: "assets/showcase/cover4.jpg", liked: false },
    ];

    document.getElementById("banners").innerHTML = D.banners.map((b) => `
      <a class="banner" href="#"><img src="${b.img}" alt="" loading="lazy" />
        <div class="banner-copy"><h3>${b.title}</h3><p>${b.desc}</p><span class="cta t-button t-button--primary">Посмотреть</span></div>
      </a>`).join("");
    document.getElementById("selections").innerHTML = D.selectionEvents.map((e, i) => U.eventCard(e, i, "sel")).join("");
    document.getElementById("free").innerHTML = D.freeEvents.map((e, i) => U.eventCard(e, i, "free")).join("");
    document.getElementById("allEvents").innerHTML = all.map((e, i) => U.gridCard(e, i)).join("");
    document.getElementById("profiles").innerHTML = D.profiles.slice(0, 5).map((p) => U.profileCard(p)).join("");
    document.getElementById("comments").innerHTML = D.comments.map((c) => `
      <button type="button" class="comment" data-toast="${c.event}">
        <div class="comment-av t-avatar t-avatar--sm"><img src="${c.av}" alt="" /></div>
        <div>
          <div class="comment-top"><strong>${c.user}</strong><time>${c.time}</time></div>
          <p class="comment-text">${c.text}</p>
          <span class="comment-event"><img src="${c.eventImg}" alt="" />${c.event}</span>
        </div>
      </button>`).join("");

    document.getElementById("searchInput")?.addEventListener("keydown", (e) => {
      if (e.key === "Enter") U.toast(`Поиск: ${e.target.value || "…"}`);
    });
    U.initRails();
    U.initCommon();
  </script>
</body>
</html>
