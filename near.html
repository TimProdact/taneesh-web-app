<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taneesh — Рядом</title>
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="icon" href="assets/brand/taneesh-logo-round.png" />
  <link rel="stylesheet" href="assets/tokens.css" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body data-page="near">
  <header class="header t-app-bar" id="header">
    <div class="wrap header-inner">
      <button class="icon-btn t-icon-button" type="button" data-toast="Карта" aria-label="Карта">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3V7z"/><path d="M9 4v13M15 7v13"/></svg>
      </button>
      <h1 class="header-title">Рядом</h1>
      <div class="header-spacer"></div>
      <button class="icon-btn t-icon-button" type="button" data-toast="Фильтры" aria-label="Фильтры">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="wrap page-pad">
      <!-- Near: vertical swipe cards → web stack of large event cards -->
      <div class="near-stack" id="near"></div>
    </div>
  </main>

  <nav id="t-nav" class="t-bottom-nav nav" aria-label="Навигация"></nav>
  <div class="toast" id="toast"></div>

  <script src="assets/app.js"></script>
  <script>
    document.getElementById("near").innerHTML = TaneeshData.nearEvents.map((ev) => `
      <button type="button" class="near-card t-event-card" data-toast="${ev.title}">
        <img src="${ev.img}" alt="" loading="lazy" />
        <span class="price ${ev.free ? "free" : "paid"}">${ev.price}</span>
        <span class="heart t-glass-icon ${ev.liked ? "is-on" : ""}" data-like="near" role="button" aria-label="Избранное">
          <svg viewBox="0 0 24 24" fill="${ev.liked ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-9.2-8.2A5.2 5.2 0 0112 5.1a5.2 5.2 0 019.2 6.7C19 15.6 12 20 12 20z"/></svg>
        </span>
        <div class="near-copy">
          <h3>${ev.title}</h3>
          <p>${ev.address}</p>
          <div class="types">${ev.types.map((t) => `<span class="type t-chip t-chip--on-media">${t}</span>`).join("")}</div>
        </div>
      </button>
    `).join("");
    TaneeshUI.initCommon();
  </script>
</body>
</html>
