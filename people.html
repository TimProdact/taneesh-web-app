<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taneesh — Люди</title>
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="icon" href="assets/brand/taneesh-logo-round.png" />
  <link rel="stylesheet" href="assets/tokens.css" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body data-page="people">
  <header class="header t-app-bar" id="header">
    <div class="wrap header-inner">
      <h1 class="header-title">Люди</h1>
      <div class="header-spacer"></div>
      <button class="icon-btn t-icon-button" type="button" data-toast="Фильтры" aria-label="Фильтры">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="wrap page-pad">
      <div class="users-grid" id="people"></div>
    </div>
  </main>

  <nav id="t-nav" class="t-bottom-nav nav" aria-label="Навигация"></nav>
  <div class="toast" id="toast"></div>

  <script src="assets/app.js"></script>
  <script>
    document.getElementById("people").innerHTML = TaneeshData.profiles.map((p) => TaneeshUI.profileCard(p, { tall: true })).join("");
    TaneeshUI.initCommon();
  </script>
</body>
</html>
