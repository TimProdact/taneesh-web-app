<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Taneesh — Поиск</title>
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="icon" href="assets/brand/taneesh-logo-round.png" />
  <link rel="stylesheet" href="assets/tokens.css?v=20260904b" />
  <link rel="stylesheet" href="assets/app.css?v=20260904b" />
</head>
<body data-shell="stack">
  <header class="header t-app-bar" id="header">
    <div class="wrap header-inner">
      <a class="icon-btn t-icon-button" href="index.html" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></a>
      <label class="search t-search search-grow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="Поиск мероприятий" />
      </label>
    </div>
  </header>
  <main><div class="wrap page-pad"><div class="grid" id="grid"></div></div></main>
  <div class="toast" id="toast"></div>
  <script src="assets/app.js?v=20260904b"></script>
  <script>
    const U = TaneeshUI;
    const input = document.getElementById("q");
    input.value = U.query("q") || "";
    const paint = () => {
      const q = input.value.trim().toLowerCase();
      const list = U.allEvents().filter((e) => !q || e.title.toLowerCase().includes(q) || e.types.join(" ").toLowerCase().includes(q));
      document.getElementById("grid").innerHTML = list.length
        ? list.map((e, i) => U.gridCard(e, i, "search")).join("")
        : `<div class="t-card t-card--subtle"><p class="detail-meta">Ничего не нашли</p></div>`;
    };
    input.addEventListener("input", paint);
    paint();
    U.initCommon();
  </script>
</body>
</html>
